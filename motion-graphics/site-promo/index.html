<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>
    <style>
      @font-face {
        font-family: "Orbitron";
        src: url("fonts/Orbitron.woff2") format("woff2");
        font-weight: 500 900;
      }
      @font-face {
        font-family: "Noto Sans KR";
        src: url("fonts/NotoSansKR.woff2") format("woff2");
        font-weight: 400 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --void: #0a0d12;
        --panel: #141922;
        --line: #2a3444;
        --ink: #e8edf4;
        --steel: #8a97ab;
        --red: #ff3b4e;
        --cyan: #22d3ee;
        --gold: #ffc849;
        --green: #4ade80;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--void);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Noto Sans KR", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(ellipse 900px 520px at 50% 0%, rgba(34, 211, 238, 0.1), transparent 70%),
          var(--void);
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .display {
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      .logo {
        font-size: 380px;
        line-height: 0.9;
        background: linear-gradient(180deg, #e8edf4 0%, #8a97ab 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo-sm {
        font-size: 240px;
      }
      .tagline {
        margin-top: 40px;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: var(--red);
      }
      .line {
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 900;
        font-size: 190px;
        line-height: 1.02;
        text-transform: uppercase;
      }
      .l3 {
        color: var(--red);
      }
      .copy-line {
        font-size: 80px;
        font-weight: 700;
        line-height: 1.4;
        text-align: center;
      }
      .hot {
        color: var(--red);
      }
      .kicker {
        margin-bottom: 56px;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--steel);
      }
      .stats {
        display: flex;
        gap: 40px;
      }
      .stat {
        width: 360px;
        height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 28px;
      }
      .num {
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 900;
        font-size: 170px;
        line-height: 1;
      }
      .lbl {
        margin-top: 24px;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--steel);
      }
      .split {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 90px;
        padding: 0 120px;
      }
      .left {
        width: 680px;
      }
      .big {
        font-size: 96px;
        line-height: 1.05;
      }
      .sub {
        margin-top: 28px;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .note {
        margin-top: 36px;
        font-size: 32px;
        color: var(--steel);
      }
      .shot {
        width: 900px;
        height: 506px;
        flex-shrink: 0;
        overflow: hidden;
        border-radius: 24px;
        border: 2px solid var(--line);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      }
      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cta {
        margin-top: 56px;
        padding: 26px 72px;
        border-radius: 999px;
        background: var(--red);
        color: #ffffff;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .url {
        margin-top: 36px;
        font-size: 36px;
        color: var(--steel);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- 0–3.2s: logo reveal -->
      <div id="s0" class="scene clip" data-start="0" data-duration="3.2" data-track-index="0">
        <div class="center">
          <div id="logo1" class="display logo">13</div>
          <div id="tag1" class="tagline">Tactical Shooter</div>
        </div>
      </div>

      <!-- 3.2–7.2s: headline -->
      <div id="s1" class="scene clip" data-start="3.2" data-duration="4" data-track-index="1">
        <div class="center">
          <div class="line l1">Five</div>
          <div class="line l2">To a</div>
          <div class="line l3">Team.</div>
        </div>
      </div>

      <!-- 7.2–11.2s: the pitch, from the site's own copy -->
      <div id="s2" class="scene clip" data-start="7.2" data-duration="4" data-track-index="2">
        <div class="center">
          <div class="copy-line c1">Open angles with your agent's abilities</div>
          <div class="copy-line c2">and settle it with the <span class="hot">spike.</span></div>
        </div>
      </div>

      <!-- 11.2–15.2s: numbers from the site -->
      <div id="s3" class="scene clip" data-start="11.2" data-duration="4" data-track-index="3">
        <div class="center">
          <div id="kick" class="kicker">The game</div>
          <div class="stats">
            <div class="stat">
              <div id="n1" class="num" style="color: var(--cyan)">0</div>
              <div class="lbl">Modes</div>
            </div>
            <div class="stat">
              <div id="n2" class="num" style="color: var(--red)">0</div>
              <div class="lbl">Agents</div>
            </div>
            <div class="stat">
              <div id="n3" class="num" style="color: var(--gold)">0</div>
              <div class="lbl">Maps</div>
            </div>
            <div class="stat">
              <div id="n4" class="num" style="color: var(--green)">0</div>
              <div class="lbl">Guns</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 15.2–18.7s: real screenshot of the site -->
      <div id="s4" class="scene clip" data-start="15.2" data-duration="3.5" data-track-index="4">
        <div class="split">
          <div class="left">
            <div id="b1" class="display big">No install.</div>
            <div id="b2" class="sub">Right in the browser.</div>
            <div id="b3" class="note">No e-mail. No verification.</div>
          </div>
          <div id="shot" class="shot">
            <img src="assets/site-landing.png" alt="" />
          </div>
        </div>
      </div>

      <!-- 18.7–21.5s: end card -->
      <div id="s5" class="scene clip" data-start="18.7" data-duration="2.8" data-track-index="5">
        <div class="center">
          <div id="logo2" class="display logo logo-sm">13</div>
          <div id="cta" class="cta">Play as guest</div>
          <div id="url" class="url">13fps.vercel.app</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Count-up for a stat. Each tween writes its rounded value into the number.
      function countTo(selector, target, at) {
        const el = document.querySelector(selector);
        const counter = { value: 0 };
        tl.to(
          counter,
          {
            value: target,
            duration: 1.3,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = Math.round(counter.value);
            },
          },
          at
        );
      }

      // 0–3.2s: logo and tagline
      tl.fromTo(
        "#logo1",
        { opacity: 0, scale: 1.08, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 1.1, ease: "power4.out" },
        0.1
      );
      tl.fromTo("#tag1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.9);
      tl.to("#s0", { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.8);

      // 3.2–7.2s: headline lines slam in one by one
      tl.fromTo(".l1", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 3.4);
      tl.fromTo(".l2", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 3.55);
      tl.fromTo(".l3", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 3.7);
      tl.to("#s1", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.8);

      // 7.2–11.2s: pitch copy
      tl.fromTo(".c1", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.6);
      tl.fromTo(".c2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.9);
      tl.to("#s2", { opacity: 0, duration: 0.4, ease: "power2.in" }, 10.8);

      // 11.2–15.2s: stat cards rise in, numbers count up
      tl.fromTo("#kick", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 11.3);
      tl.fromTo(
        ".stat",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.15 },
        11.4
      );
      countTo("#n1", 11, 11.6);
      countTo("#n2", 42, 11.75);
      countTo("#n3", 21, 11.9);
      countTo("#n4", 31, 12.05);
      tl.to("#s3", { opacity: 0, duration: 0.4, ease: "power2.in" }, 14.8);

      // 15.2–18.7s: screenshot slides in, copy follows
      tl.fromTo(
        "#shot",
        { x: 160, opacity: 0, scale: 0.94 },
        { x: 0, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
        15.4
      );
      tl.fromTo("#b1", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power4.out" }, 15.5);
      tl.fromTo("#b2", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power4.out" }, 15.7);
      tl.fromTo("#b3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 16.0);
      tl.to("#s4", { opacity: 0, duration: 0.4, ease: "power2.in" }, 18.3);

      // 18.7–21.5s: end card
      tl.fromTo("#logo2", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power4.out" }, 18.9);
      tl.fromTo("#cta", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 19.6);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 20.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
